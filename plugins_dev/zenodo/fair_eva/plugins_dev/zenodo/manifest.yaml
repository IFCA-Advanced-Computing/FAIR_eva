plugin_id: "zenodo_standalone_connector"
community: "General Open Science Community"
version: "0.1.0"

connection:
  protocol: "oai_pmh"
  base_endpoint: "https://data.rijksmuseum.nl/oai"
  metadata_prefix: "oai_dc"
  identifier_template: "https://id.rijksmuseum.nl/{id}"
  timeout_seconds: 30

parsing:
  format: "XML"

metadata_mapping:
  identifier: "$.metadata.identifier[*]['#text']"
  metadata_identifier: "$.metadata.identifier[*]['#text']"
  title: "$.metadata.title[0]['#text']"
  publication_date: "$.metadata.date[0]['#text']"
  license: "$.metadata.rights[-1]['#text']"
