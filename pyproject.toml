[build-system]
requires = ["flit_core<4"]
build-backend = "flit_core.buildapi"

[project]
name = "fair_eva"
version = "1.5.0"
authors = [
  { name="Fernando Aguilar Gómez", email="aguilarf@ifca.unican.es" },
  { name="Pablo Orviz Fernández", email="orviz@ifca.unican.es" },
  { name="Iván Palomo Llavona", email="palomo@ifca.unican.es" },
]
description = "FAIR EVA: Evaluator, Validator & Advisor"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache License 2.0",
    "Operating System :: OS Independent",
]

dependencies = [
    "werkzeug==3.0.3",
    "connexion[flask,uvicorn]",
    "swagger-ui-bundle==0.0.6",
    "flask==2.2.5",
    "flask_wtf",
    "bs4",
    "psycopg2-binary",
    "pandas",
    "idutils",
    "Babel",
    "flask_babel",
    "reportlab",
    "jsonpath-ng>=1.6.1",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.3",
    # Local dev plugin
    "fair-eva-plugin-zenodo",
]

[project.scripts]
fair-eva = "fair_eva.__main__:main"

[project.urls]
"Homepage" = "https://github.com/ifca-advanced-computing/FAIR_eva"
"Bug Tracker" = "https://github.com/ifca-advanced-computing/FAIR_eva/issues"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.package-data]
"fair_eva" = ["*.ini"]

[tool.docformatter]
black = true
recursive = true
non-strict = false
in-place = true

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# HACK DURING DEV: define 'plugins_dev/zenodo' as member of our current workspace
[tool.uv.workspace]
members = ["plugins_dev/zenodo"]

[tool.uv.sources]
# Le indicamos a uv de dónde tiene que sacar el paquete de forma local
fair-eva-plugin-zenodo = { workspace = true }
